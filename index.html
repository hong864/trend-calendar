<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전사 트렌드 캘린더</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --border: #ECE9E2;
    --border-strong: #D9D4CC;
    --text-900: #2A2620;
    --text-700: #4A4338;
    --text-500: #7A7165;
    --text-400: #9C9388;
    --accent: #E76F51;
    --chip-bg: #FFFFFF;
    --chip-bg-active: #FDF1E8;
    --chip-border-active: #E76F51;
    --tag-holiday: #FFE2E2;   --tag-holiday-tx: #B23A3A;
    --tag-anniv:   #FFEAD2;   --tag-anniv-tx:   #B5651D;
    --tag-jeolgi:  #FFF6CC;   --tag-jeolgi-tx:  #8A6B00;
    --tag-season:  #DFF4DC;   --tag-season-tx:  #2F7A38;
    --tag-sport:   #DDEBFF;   --tag-sport-tx:   #1F5BB8;
    --tag-culture: #ECDFF7;   --tag-culture-tx: #6B3FAF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-900);
    font-size: 14px;
    line-height: 1.45;
  }
  .container {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    padding: 20px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .main { min-width: 0; }
  header.month-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .month-nav button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-700);
    border-radius: 8px;
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .month-nav button:hover { background: var(--chip-bg-active); }
  .month-nav h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0 6px;
    letter-spacing: -0.01em;
  }
  .right-tools {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sync-info {
    font-size: 11.5px;
    color: var(--text-500);
  }
  .today-btn {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    color: var(--text-700);
    font-weight: 500;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 6px 8px;
    background: var(--chip-bg);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    font-size: 13px;
    color: var(--text-700);
  }
  .chip:hover { border-color: var(--chip-border-active); }
  .chip input[type="checkbox"] {
    appearance: none;
    width: 14px; height: 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: 3px;
    margin: 0;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .chip input[type="checkbox"]:checked {
    background: var(--chip-border-active);
    border-color: var(--chip-border-active);
  }
  .chip input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 0px;
    width: 4px; height: 8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .chip:has(input:checked) {
    background: var(--chip-bg-active);
    border-color: var(--chip-border-active);
    color: var(--accent);
    font-weight: 500;
  }

  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #FBF9F4;
    border-bottom: 1px solid var(--border);
  }
  .weekday {
    text-align: left;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-500);
    font-weight: 500;
  }
  .weekday.sun { color: #C44; }
  .weekday.sat { color: #4567B0; }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(110px, auto);
  }
  .day {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 6px 8px 6px;
    position: relative;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .day:nth-child(7n) { border-right: none; }
  .day.other-month .date { color: var(--text-400); }
  .day.other-month { background: #FBFAF6; }
  .day .date {
    font-size: 12px;
    color: var(--text-700);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .day.sun .date { color: #C44; }
  .day.sat .date { color: #4567B0; }
  .event {
    font-size: 11.5px;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--tag-anniv);
    color: var(--tag-anniv-tx);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
  }
  .event:hover { border-color: rgba(0,0,0,0.1); }
  .event.공휴일       { background: var(--tag-holiday);  color: var(--tag-holiday-tx); }
  .event.기념일       { background: var(--tag-anniv);    color: var(--tag-anniv-tx); }
  .event.절기         { background: var(--tag-jeolgi);   color: var(--tag-jeolgi-tx); }
  .event.시즌이슈     { background: var(--tag-season);   color: var(--tag-season-tx); }
  .event.스포츠       { background: var(--tag-sport);    color: var(--tag-sport-tx); }
  .event.사회문화     { background: var(--tag-culture);  color: var(--tag-culture-tx); }
  .event.range { border-radius: 0; }
  .event.range.start { border-radius: 4px 0 0 4px; padding-right: 2px; }
  .event.range.end { border-radius: 0 4px 4px 0; padding-left: 7px; }
  .event.range.middle { padding-left: 2px; padding-right: 2px; color: transparent; }

  aside.sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .panel h3 {
    margin: 0 0 10px 0;
    font-size: 13px;
    color: var(--text-700);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-card { margin: -14px -16px 12px -16px; padding: 0; }
  .theme-img {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #DDEBFF 0%, #B6D0F6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .theme-card h4 { margin: 12px 16px 8px 16px; font-size: 15px; font-weight: 700; }
  .theme-tags { margin: 0 16px 14px 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .theme-tag { font-size: 11px; padding: 3px 8px; background: #F4F1EC; color: var(--text-700); border-radius: 999px; }
  .detail-empty { color: var(--text-500); font-size: 12.5px; }
  .detail h4 { margin: 0 0 6px 0; font-size: 14px; font-weight: 600; }
  .detail .meta { color: var(--text-500); font-size: 12px; margin-bottom: 8px; }
  .detail .action {
    background: #FBF8F2;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    color: var(--text-700);
    border-left: 3px solid var(--accent);
  }
  .detail .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
  .detail .tags span { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #F4F1EC; color: var(--text-700); }
  .footnote { margin-top: 8px; font-size: 11.5px; color: var(--text-500); text-align: center; }
  .loading, .error {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-500);
  }
  .error { color: #C44; }
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
  <h2 class="sr-only">전사 트렌드 캘린더 - 카테고리 체크박스로 필터링 가능한 월간 이벤트 캘린더</h2>
  <div class="container">
    <div class="main">
      <header class="month-bar">
        <div class="month-nav">
          <button id="prev" aria-label="이전 달">‹</button>
          <h1 id="month-label">로딩 중…</h1>
          <button id="next" aria-label="다음 달">›</button>
        </div>
        <div class="right-tools">
          <span class="sync-info" id="sync-info"></span>
          <button id="today" class="today-btn">오늘</button>
        </div>
      </header>

      <div class="filter-bar" id="filters">
        <label class="chip"><input type="checkbox" value="ALL" checked> 전체</label>
        <label class="chip"><input type="checkbox" value="공휴일" checked> 공휴일</label>
        <label class="chip"><input type="checkbox" value="기념일" checked> 기념일</label>
        <label class="chip"><input type="checkbox" value="절기" checked> 절기</label>
        <label class="chip"><input type="checkbox" value="시즌 이슈" checked> 시즌 이슈</label>
        <label class="chip"><input type="checkbox" value="스포츠" checked> 스포츠</label>
        <label class="chip"><input type="checkbox" value="사회/문화" checked> 사회·문화</label>
      </div>

      <div id="calendar-wrap">
        <div class="loading" id="loading">데이터를 불러오는 중…</div>
      </div>

      <div class="footnote">데이터 원본: Notion · 트렌드 &amp; 이벤트 DB · GitHub Actions로 자동 동기화</div>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h3>🎯 이달의 테마</h3>
        <div class="theme-card">
          <div class="theme-img">🏆⚽</div>
          <h4 id="theme-title">로딩 중…</h4>
          <div class="theme-tags" id="theme-tags"></div>
        </div>
      </div>

      <div class="panel">
        <h3>📌 일정 상세</h3>
        <div id="detail" class="detail">
          <div class="detail-empty">왼쪽 달력에서 일정을 클릭하면 이 영역에 일정명·날짜·담당 부서·액션 아이템이 표시됩니다.</div>
        </div>
      </div>
    </aside>
  </div>

<script>
let viewYear, viewMonth;
let events = [];

function getActiveTypes() {
  const allChecked = document.querySelector('input[value="ALL"]').checked;
  if (allChecked) {
    return ["공휴일","기념일","절기","시즌 이슈","스포츠","사회/문화"];
  }
  return Array.from(document.querySelectorAll('#filters input[type=checkbox]'))
    .filter(c => c.checked && c.value !== "ALL")
    .map(c => c.value);
}

function typeClass(type) {
  switch(type) {
    case "공휴일": return "공휴일";
    case "기념일": return "기념일";
    case "절기": return "절기";
    case "시즌 이슈": return "시즌이슈";
    case "스포츠": return "스포츠";
    case "사회/문화": return "사회문화";
  }
  return "";
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function renderCalendar() {
  document.getElementById('month-label').textContent = `${viewYear}년 ${viewMonth}월`;

  // Replace loading with calendar grid if needed
  const wrap = document.getElementById('calendar-wrap');
  if (!document.getElementById('days-grid')) {
    wrap.innerHTML = `
      <div class="calendar">
        <div class="weekday-row">
          <div class="weekday sun">일</div>
          <div class="weekday">월</div>
          <div class="weekday">화</div>
          <div class="weekday">수</div>
          <div class="weekday">목</div>
          <div class="weekday">금</div>
          <div class="weekday sat">토</div>
        </div>
        <div class="days-grid" id="days-grid"></div>
      </div>
    `;
  }

  const grid = document.getElementById('days-grid');
  grid.innerHTML = '';

  const activeTypes = getActiveTypes();
  const firstDay = new Date(viewYear, viewMonth - 1, 1);
  const startWeekday = firstDay.getDay();
  const gridStart = new Date(viewYear, viewMonth - 1, 1 - startWeekday);

  // Determine if we need 6 rows (some months span 6 weeks)
  const lastDay = new Date(viewYear, viewMonth, 0).getDate();
  const cellsNeeded = startWeekday + lastDay;
  const totalCells = cellsNeeded > 35 ? 42 : 35;

  for (let i = 0; i < totalCells; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const dayCell = document.createElement('div');
    dayCell.className = 'day';
    const dow = d.getDay();
    if (dow === 0) dayCell.classList.add('sun');
    if (dow === 6) dayCell.classList.add('sat');
    if (d.getMonth() + 1 !== viewMonth) dayCell.classList.add('other-month');

    const dateLabel = document.createElement('div');
    dateLabel.className = 'date';
    dateLabel.textContent = d.getDate();
    dayCell.appendChild(dateLabel);

    const dayIso = isoDate(d);

    events.forEach((ev) => {
      if (!activeTypes.includes(ev.type)) return;
      const start = ev.start;
      const end = ev.end || ev.start;
      if (dayIso >= start && dayIso <= end) {
        const elem = document.createElement('div');
        const isRange = ev.start !== (ev.end || ev.start);
        let cls = `event ${typeClass(ev.type)}`;
        if (isRange) {
          cls += ' range';
          if (dayIso === start) cls += ' start';
          else if (dayIso === end) cls += ' end';
          else cls += ' middle';
        }
        elem.className = cls;
        elem.textContent = ev.title;
        elem.title = ev.title;
        elem.addEventListener('click', () => showDetail(ev));
        dayCell.appendChild(elem);
      }
    });

    grid.appendChild(dayCell);
  }
}

function showDetail(ev) {
  const el = document.getElementById('detail');
  const dateText = ev.end && ev.end !== ev.start
    ? `📅 ${ev.start} ~ ${ev.end}`
    : `📅 ${ev.start}`;
  const priorityIcon = ev.priority === '높음' ? '🔴' : ev.priority === '보통' ? '🟡' : '⚪';
  const deptChips = (ev.dept || []).map(d => `<span>${d}</span>`).join('');
  const kwChips = (ev.keywords || []).map(k => `<span>#${k}</span>`).join('');
  el.innerHTML = `
    <h4>${ev.title}</h4>
    <div class="meta">${dateText} · ${ev.type} · ${priorityIcon} ${ev.priority || '-'}</div>
    ${ev.action ? `<div class="action">💡 ${ev.action}</div>` : ''}
    <div class="tags">${deptChips}${kwChips}</div>
    ${ev.memo ? `<div style="margin-top:10px;font-size:11.5px;color:var(--text-500);">📝 ${ev.memo}</div>` : ''}
  `;
}

function renderTheme() {
  // Pick highest-priority items from current month
  const monthPrefix = `${viewYear}-${String(viewMonth).padStart(2,'0')}`;
  const highs = events.filter(e =>
    e.priority === '높음' &&
    e.start && (e.start.startsWith(monthPrefix) || (e.end && e.start <= `${monthPrefix}-30` && e.end >= `${monthPrefix}-01`))
  );
  const tags = new Set();
  highs.forEach(e => (e.keywords || []).forEach(k => tags.add(k)));
  highs.forEach(e => tags.add(e.title.split(' ')[0]));

  const topTitle = highs[0] ? highs[0].title : '—';
  document.getElementById('theme-title').textContent = topTitle;
  const tagsEl = document.getElementById('theme-tags');
  tagsEl.innerHTML = Array.from(tags).slice(0, 6).map(t => `<span class="theme-tag">#${t}</span>`).join('');
}

function setSyncInfo(updatedAt) {
  if (!updatedAt) return;
  const d = new Date(updatedAt);
  if (isNaN(d.getTime())) return;
  document.getElementById('sync-info').textContent =
    `마지막 동기화: ${d.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' })}`;
}

document.querySelectorAll('#filters input[type="checkbox"]').forEach(cb => {
  cb.addEventListener('change', (e) => {
    if (e.target.value === "ALL") {
      document.querySelectorAll('#filters input[type="checkbox"]').forEach(other => {
        if (other.value !== "ALL") other.checked = e.target.checked;
      });
    } else {
      const individuals = Array.from(document.querySelectorAll('#filters input[type="checkbox"]'))
        .filter(c => c.value !== "ALL");
      const allOn = individuals.every(c => c.checked);
      document.querySelector('input[value="ALL"]').checked = allOn;
    }
    renderCalendar();
  });
});

document.getElementById('prev').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderCalendar();
  renderTheme();
});
document.getElementById('next').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderCalendar();
  renderTheme();
});
document.getElementById('today').addEventListener('click', () => {
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth() + 1;
  renderCalendar();
  renderTheme();
});

async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    events = data.events || [];
    setSyncInfo(data.updatedAt);

    // Set initial view to first event's month, or today
    const t = new Date();
    if (events.length > 0 && events[0].start) {
      const first = new Date(events[0].start);
      // Use today if data covers today, else first event's month
      const todayIso = isoDate(t);
      const hasToday = events.some(e => {
        const s = e.start, en = e.end || e.start;
        return s <= todayIso && en >= todayIso;
      });
      if (hasToday) {
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
      } else {
        viewYear = first.getFullYear();
        viewMonth = first.getMonth() + 1;
      }
    } else {
      viewYear = t.getFullYear();
      viewMonth = t.getMonth() + 1;
    }

    renderCalendar();
    renderTheme();
  } catch (err) {
    document.getElementById('calendar-wrap').innerHTML =
      `<div class="error">데이터를 불러오지 못했습니다: ${err.message}<br><br>
       <small>data.json 파일이 같은 폴더에 있는지, GitHub Actions가 정상 실행됐는지 확인해주세요.</small></div>`;
    console.error(err);
  }
}

loadData();
</script>
</body>
</html>
